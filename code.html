<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live HTML Renderer</title>
  
  <!-- CodeMirror Base CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  
  <!-- Autocomplete Hint CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .container {
      display: flex;
      height: 100vh;
      flex-direction: row; 
    }

    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #ddd;
      min-width: 0; 
      min-height: 0; 
    }

    .pane:last-child {
      border-right: none;
      background: #f9f9f9;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .pane {
        border-right: none;
        border-bottom: 2px solid #ddd;
      }
      .pane:last-child {
        border-bottom: none;
      }
    }

    .header {
      padding: 8px 12px;
      background: #222;
      color: white;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .btn {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: #444;
      border-color: #ff79c6;
    }

    .btn:active {
      background: #555;
    }

    .CodeMirror {
      flex: 1;
      height: 100%;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="pane">
      <div class="header">
        <span>HTML Editor</span>
        <div class="header-actions">
          <button id="selectBtn" class="btn" type="button">Select All</button>
          <button id="copyBtn" class="btn" type="button">Copy Code</button>
          <button id="downloadBtn" class="btn" type="button">Download .html</button>
        </div>
      </div>
      <textarea id="editor">
<div class="card">
  <h1>
    Hello World
  </h1>
  <p>
    This is a simple paragraph with <strong>strong</strong> text, <em>emphasis</em>, text and <u>underlined</u> text.
  </p>
</div>

<style>
  body{
    display:grid;
    place-items:center;
    height:100vh;
    background:#fcfcfc;
  }
  .card{
    font-family:sans-serif;
    padding:1rem;
    border-radius:0.5rem;
    background:#F5E0D3;
    color:#275462;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    text-align:center;
  }
</style>
      </textarea>
    </div>

    <div class="pane">
      <div class="header">Live Output</div>
      <iframe id="viewer"></iframe>
    </div>
  </div>

  <!-- CodeMirror Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

  <!-- Addons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/fold/xml-fold.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/xml-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/html-hint.min.js"></script>

  <script>
    const viewer = document.getElementById('viewer');
    const selectBtn = document.getElementById('selectBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // Initialize CodeMirror with contenteditable input mode
    const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
      mode: 'htmlmixed',
      theme: 'dracula',
      lineNumbers: true,
      lineWrapping: true,
      tabSize: 2,
      autoCloseTags: true,
      
      // Enables native selection, touch handles, and native Select All context menus
      inputStyle: 'contenteditable',
      
      extraKeys: {
        "Ctrl-A": "selectAll",
        "Cmd-A": "selectAll",
        "Ctrl-Space": "autocomplete"
      }
    });

    // Auto-trigger tag hints when typing '<'
    editor.on('inputRead', (cm, change) => {
      if (change.origin === '+input' && change.text[0] === '<') {
        cm.execCommand('autocomplete');
      }
    });

    // Update Iframe Preview
    function updatePreview() {
      viewer.srcdoc = editor.getValue();
    }
    editor.on('change', updatePreview);
    updatePreview();

    // 1. Select All Button
    selectBtn.addEventListener('click', () => {
      editor.focus();
      editor.execCommand('selectAll');
    });

    // 2. Copy Code Button
    copyBtn.addEventListener('click', () => {
      const code = editor.getValue();
      navigator.clipboard.writeText(code).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied! ✓';
        copyBtn.style.borderColor = '#50fa7b';
        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.style.borderColor = '#555';
        }, 1500);
      }).catch(err => {
        console.error('Failed to copy code: ', err);
      });
    });

    // 3. Download HTML File Button
    downloadBtn.addEventListener('click', () => {
      const code = editor.getValue();
      const blob = new Blob([code], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement('a');
      link.href = url;
      link.download = 'index.html';
      document.body.appendChild(link);
      link.click();
      
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>
